<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Local 5</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css" integrity="sha512-5Hs3dF2AEPkpNAR7UiOHba+lRSJNeM2ECkwxUIxC1Q/FLycGTbNapWXB4tP889k5T5Ju8fs4b1P5z/iB4nMfSQ==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body>
    <h3 class="bg-warning text-center p-2">Student with Local Storage 5</h3>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="card border">
                    <h4 class="bg-primary text-center text-white p-2">Employee Form</h4>
                    <div class="card-body">
                        <form action="" id="empForm">
                            <div class="form-row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="name">Employee Name<span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="name">
                                    </div>
                                </div>

                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="age">Age<span class="text-danger">*</span></label>
                                        <input type="text" class="form-control" id="age">
                                    </div>
                                </div>


                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="role">Role<span class="text-danger">*</span></label>
                                        <select class="form-control" id="role">
                                            <option value="">--select-role</option>
                                            <option value="Developer">Developer</option>
                                            <option value="Designer">Designer</option>
                                            <option value="Tester">Tester</option>
                                            <option value="Manager">Manager</option>

                                        </select>
                                    </div>
                                </div>


                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label for="experience">Experience<span class="text-danger">*</span></label>
                                        <input type="number" max="2" min="0" step="1" class="form-control" id="experience">
                                    </div>
                                </div>

                                <button type="submit" class="btn btn-primary btn-sm btn-block" id="addEmp">Add Employee</button>
                                <button type="button" class="btn btn-success btn-sm btn-block d-none" id="updateEmp">Update Employee</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-2">
                <div class="table-responsive">
                    <table class="table border table-bordered table-hover">
                        <thead class="border bg-primary">
                            <tr>
                                <th>Sr No</th>
                                <th>Employee Name</th>
                                <th>Age</th>
                                <th>Designation</th>
                                <th>Experience</th>
                                <th>Edit</th>
                                <th>Remove</th>
                            </tr>
                        </thead>

                        <tbody class="border" id="empList">
                            <tr>
                                <td>1</td>
                                <td>1</td>
                                <td>1</td>
                                <td>1</td>
                                <td>1</td>
                                <td><button class="btn btn-sm btn-success" type="button">Edit</button></td>
                                <td><button class="btn btn-sm btn-danger" type="button">Remove</button></td>

                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="./assets/js/app.js"></script>
</body>
</html>
